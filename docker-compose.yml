services:
  decatone:
    image: tylerhats/decatone:latest
    container_name: decatone-app
    restart: unless-stopped
    ports:
      - "4000:4000"
      # Uncomment below to enable built-in Automatic Let's Encrypt (ACME HTTP-01) bare-metal/internet TLS:
      # - "80:80"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}
      # Set TRUST_PROXY=1 (or trusted proxy IP/CIDR) when running behind Nginx/Traefik/Caddy,
      # or configure Trust Proxy dynamically inside the DecaTone Web UI (Admin -> Networking & TLS).
      - TRUST_PROXY=${TRUST_PROXY:-}
      # Optional overrides: proxy | acme | local_ca
      - TLS_MODE=${TLS_MODE:-}
      - ACME_HTTP_PORT=${ACME_HTTP_PORT:-80}
      # Optional cookie Secure override ('true' | 'false'); auto-detected from req.secure by default
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    volumes:
      - decatone-data:/app/backend/data
      - decatone-uploads:/app/backend/uploads

volumes:
  decatone-data:
  decatone-uploads:
